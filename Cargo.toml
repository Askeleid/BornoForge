[package]
name = "BornoForge"
version = "0.1.0"
edition = "2024"
authors = ["Anup Sarker <Askeleid>"]
description = "High-performance Bengali game localization font subsetter and HarfRust shaping-diff validator"
license = "MIT"

[dependencies]
harfrust = "0.15"
skera = "0.9"
read-fonts = "0.46"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
fontdue = "0.9"
wasm-bindgen = "0.2"

[[bin]]
name = "BornoForge"
path = "src/main.rs"

[lib]
name = "borno_forge_wasm"
crate-type = ["cdylib"]