
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f1e8">

    <title>BornoForge | Bengali Shaping Lab</title>

    <style>
        :root {
            --paper: #f5f1e8;
            --surface: #fffdf8;
            --ink: #292b2a;
            --muted: #77766f;
            --accent: #ad5946;
            --border: #ded8ca;
            --code-bg: #ece8df;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 24px;
            background-color: #eee5d5;
            background-image:
                linear-gradient(
                    rgba(245, 241, 232, 1.00),
                    rgba(245, 241, 232, 0.30)
                ),
                url("../assets/bangla_typography.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--ink);
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 36px;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--accent);
        }

        .panel img[hidden] {
            display: none;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .section-label {
            margin: 28px 0 12px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .input-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        #text-input {
            width: 100%;
            min-height: 54px;
            padding: 14px 16px;
            resize: none;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
            font-family: inherit;
            font-size: 1.1rem;
            line-height: 1.7;
            outline: none;
        }

        #text-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(173, 89, 70, 0.12);
        }

        #shape-button {
            padding: 11px 22px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        #shape-button:hover {
            background: #914735;
        }

        .comparison {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .panel {
            min-width: 0;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
        }

        .panel h3 {
            margin: 0 0 14px;
            font-size: 1rem;
        }

        .panel img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #0d1117;
        }

        #output {
            padding: 16px;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--code-bg);
            color: var(--ink);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        footer {
            margin-top: 48px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 700px) {
            body {
                padding: 28px 16px;
            }

            .comparison {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1><span>Borno</span>Forge</h1>
            <p class="subtitle">
                A small laboratory for Bengali typography and OpenType shaping.
            </p>
        </header>

        <section>
            <div class="section-label">Input Text</div>

            <div class="input-area">
                <textarea id="text-input" rows="1">ক্ষ্ম</textarea>
                <button id="shape-button">Shape Text</button>
            </div>
        </section>

        <section>
            <div class="section-label">Glyph Comparison</div>

           <div class="comparison">
                <div class="panel">
                    <h3>Without OpenType Shaping</h3>
                    <img
                        id="unshaped-output"
                        alt="Bengali text rendered without OpenType shaping"
                        hidden
                    >
                </div>

                <div class="panel">
                    <h3>With HarfRust Shaping</h3>
                    <img
                        id="rendered-output"
                        alt="Bengali text rendered with HarfRust shaping"
                        hidden
                    >
                </div>
            </div>
        </section>

        <section>
            <div class="section-label">Shaping Information</div>
            <pre id="output">Loading WASM...</pre>
        </section>

        <footer>
            BornoForge · Built with Rust and HarfRust
        </footer>
    </main>

    <script type="module">
        import init, {
            shape_bengali,
            render_shaped,
            render_unshaped
        } from "./wasm/borno_forge_wasm.js";

        async function main() {
            await init();

            const textInput = document.getElementById("text-input");

            function resizeInput() {
                textInput.style.height = "auto";
                textInput.style.height = `${textInput.scrollHeight}px`;
            }

            textInput.addEventListener("input", resizeInput);
            resizeInput();

            const response = await fetch("../assets/NotoSansBengali-Regular.ttf");

            if (!response.ok) {
                throw new Error("Could not load Bengali font");
            }

            const fontData = new Uint8Array(await response.arrayBuffer());

            document.getElementById("output").textContent =
                "WASM ready. Enter Bengali text and click Shape Text.";

            document.getElementById("shape-button").addEventListener("click", () => {
                const text = textInput.value;

                try {
                    const result = JSON.parse(shape_bengali(fontData, text));

                    document.getElementById("output").textContent =
                        JSON.stringify(result, null, 2);

                    const unshapedBytes = render_unshaped(fontData, text);
                    const shapedBytes = render_shaped(fontData, text);

                    function displayImage(elementId, bytes) {
                        const blob = new Blob([bytes], {
                            type: "image/png"
                        });

                        const imageUrl = URL.createObjectURL(blob);
                        const output = document.getElementById(elementId);

                        if (output.dataset.url) {
                            URL.revokeObjectURL(output.dataset.url);
                        }

                        output.src = imageUrl;
                        output.hidden = false;
                        output.dataset.url = imageUrl;
                    }

                    displayImage("unshaped-output", unshapedBytes);
                    displayImage("rendered-output", shapedBytes);

                } catch (error) {
                    document.getElementById("output").textContent =
                        `Shaping failed: ${error}`;

                    console.error(error);
                }
            });
        }

        main().catch(error => {
            document.getElementById("output").textContent =
                `Initialization failed: ${error}`;

            console.error(error);
        });
    </script>
</body>
</html>
